id: R3
name: "Hardcoded Secret in Code"
description: "AI agent wrote code containing hardcoded secrets or API keys"
severity: CRITICAL
mitre_technique: "T1552.001"
mitre_name: "Unsecured Credentials: Credentials In Files"
action_types:
  - file_create
  - file_edit
check: pattern
patterns:
  - 'AKIA[0-9A-Z]{16}'
  - 'ghp_[A-Za-z0-9]{36}'
  - 'gho_[A-Za-z0-9]{36}'
  - 'github_pat_[A-Za-z0-9_]{40,}'
  - 'sk-[A-Za-z0-9]{20,}'
  - 'xox[bpors]-[A-Za-z0-9\-]{10,}'
  - '-----BEGIN\s+(RSA\s+)?PRIVATE\s+KEY-----'
  - 'pypi-[A-Za-z0-9_\-]{50,}'
suppress_placeholders: true
